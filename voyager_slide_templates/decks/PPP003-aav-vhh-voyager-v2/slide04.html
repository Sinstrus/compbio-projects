<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body style="width: 960px; height: 540px; position: relative; margin: 0;
             font-family: Calibri, Arial, sans-serif; background: #fff;">
  <!-- Background image -->
  <div style="position: absolute; right: 0; top: 0; width: 65%; height: 400px;">
    <img src="deck-assets/neuron-bg.jpeg" style="width: 100%; height: 100%; object-fit: cover;"/>
  </div>

  <!-- White fade -->
  <div style="position: absolute; left: 0; top: 0; width: 55%; height: 400px;
              background: linear-gradient(90deg, #fff 60%, transparent);"></div>

  <!-- Bottom gradient bar -->
  <div style="position: absolute; bottom: 50px; left: 0; width: 100%; height: 120px;
              background: linear-gradient(90deg, #001446, #003482 80%);"></div>

  <!-- Section label -->
  <p style="position: absolute; left: 50px; top: 70px; font-size: 12pt; color: #FF7400;
            font-weight: bold; letter-spacing: 2px; margin: 0;">SECTION 01</p>

  <!-- Title -->
  <h1 style="position: absolute; left: 50px; top: 100px; font-family: 'Century Gothic', Arial, sans-serif;
             color: #003482; font-size: 40pt; margin: 0; font-weight: bold;">Construct Design</h1>

  <!-- Subtitle -->
  <p style="position: absolute; left: 50px; top: 165px; color: #FF7400;
            font-size: 16pt; margin: 0;">Plasmid Engineering Strategy</p>

  <!-- Footer -->
  <p style="position: absolute; bottom: 65px; right: 50px; color: #fff;
            font-size: 10px; margin: 0;">CONFIDENTIAL</p>
</body>
</html>
