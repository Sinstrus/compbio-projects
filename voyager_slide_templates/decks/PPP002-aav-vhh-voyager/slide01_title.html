<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title Slide</title>
  <style>
    :root {
      --voyager-navy: #001446;
      --voyager-blue: #003482;
      --voyager-orange: #FF7400;
      --voyager-amber: #F9A72C;
      --voyager-light-blue: #4E8EC9;
      --voyager-gray: #F3F3F7;
      --voyager-dark-gray: #414953;
    }
  </style>
</head>
<body style="width: 960px; height: 540px; position: relative; margin: 0; font-family: Arial, sans-serif; background: #ffffff;">
  <!-- Background image on right -->
  <div style="position: absolute; right: 0; top: 0; width: 60%; height: 460px;">
    <img src="deck-assets/neuron-bg.jpeg" style="width: 100%; height: 100%; object-fit: cover;" />
  </div>

  <!-- White fade overlay -->
  <div style="position: absolute; left: 0; top: 0; width: 85%; height: 460px; background: linear-gradient(90deg, #ffffff 55%, rgba(255,255,255,0.95) 65%, rgba(255,255,255,0) 100%);"></div>

  <!-- Footer gradient bar -->
  <div style="position: absolute; bottom: 40px; left: 0; width: 100%; height: 50px; background: linear-gradient(90deg, #001446, #003482);"></div>

  <!-- Title content -->
  <div style="position: absolute; left: 50px; top: 140px; width: 480px; background: rgba(255,255,255,0.85); padding: 28px 32px; border-radius: 4px;">
    <h1 style="color: #003482; font-size: 32px; margin: 0 0 12px 0; font-weight: bold; line-height: 1.2;">AAV-VHH DISPLAY PLATFORM</h1>
    <p style="color: #FF7400; font-size: 20px; margin: 0; font-weight: 500;">In Vitro Proof of Concept</p>
  </div>

  <!-- Bottom info on gradient bar -->
  <div style="position: absolute; bottom: 52px; left: 50px;">
    <p style="font-size: 12px; color: rgba(255,255,255,0.8); margin: 0;">Phase I: Construct Design & Validation</p>
  </div>
  <div style="position: absolute; bottom: 52px; right: 50px;">
    <p style="font-size: 12px; color: rgba(255,255,255,0.8); margin: 0;">January 2026</p>
  </div>
</body>
</html>
