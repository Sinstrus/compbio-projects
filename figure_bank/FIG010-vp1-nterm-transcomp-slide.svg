<text x="362" y="187" font-size="16" font-weight="bold" fill="#CCC">VP2</text>
<rect x="440" y="168" width="175" height="28" rx="4" fill="none" stroke="#CCC" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="528" y="187" text-anchor="middle" font-size="20" font-weight="bold" fill="#CCC">&#215;</text>
<text x="442" y="212" font-size="14" fill="#CCC">ACG&#8594;ACC (KO)</text>

<!-- VP3 knocked out -->
<text x="362" y="257" font-size="16" font-weight="bold" fill="#CCC">VP3</text>
<rect x="460" y="238" width="155" height="28" rx="4" fill="none" stroke="#CCC" stroke-width="1.5" stroke-dasharray="5,3"/>
