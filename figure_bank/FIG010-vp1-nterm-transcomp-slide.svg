<path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
</marker>
</defs>
<rect width="900" height="420" fill="white"/>

<!-- Title (24pt bold) -->
<text x="450" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">VP1 N-term Trans-Comp</text>

<!-- ========== BOX 1: AVD005 &#8212; VP1-KO Helper ========== -->
<rect x="10" y="52" width="280" height="250" rx="6" fill="#F8F9FA" stroke="#DDD"/>
<text x="150" y="78" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">AVD005 &#8212; VP1-KO</text>

<!-- VP1 knocked out -->
<text x="22" y="117" font-size="16" font-weight="bold" fill="#CCC">VP1</text>
<rect x="60" y="98" width="215" height="28" rx="4" fill="none" stroke="#CCC" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="168" y="117" text-anchor="middle" font-size="20" font-weight="bold" fill="#CCC">&#215;</text>
<text x="62" y="142" font-size="14" fill="#CCC">ATG&#8594;AAG (KO)</text>

<!-- VP2 normal -->
<text x="22" y="187" font-size="16" font-weight="bold" fill="#333">VP2</text>
<rect x="100" y="168" width="175" height="28" rx="4" fill="#3B7DD8"/>
<text x="102" y="212" font-size="14" fill="#999">ACG &#8212; 65.5 kDa</text>

<!-- VP3 normal -->
<text x="22" y="257" font-size="16" font-weight="bold" fill="#333">VP3</text>
<rect x="120" y="238" width="155" height="28" rx="4" fill="#A8C8E8"/>
<text x="122" y="282" font-size="14" fill="#999">ATG &#8212; 59.0 kDa</text>

<!-- ========== + SYMBOL ========== -->
<text x="320" y="192" text-anchor="middle" font-size="36" font-weight="bold" fill="#333">+</text>

