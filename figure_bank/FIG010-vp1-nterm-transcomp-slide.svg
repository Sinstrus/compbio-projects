<polygon points="792,220 792,194 743,192" fill="#3B7DD8" stroke="#555" stroke-width="0.7"/><!-- VP2 -->
<polygon points="800,188 853,186 825,142" fill="#A8C8E8" stroke="#555" stroke-width="0.7"/>
<polygon points="798,220 848,192 798,194" fill="#A8C8E8" stroke="#555" stroke-width="0.7"/>
<polygon points="770,139 795,185 820,139" fill="#A8C8E8" stroke="#555" stroke-width="0.7"/>
<!-- VHH marker on VP1 face only (100% VP1-VHH) -->
<circle cx="744" cy="148" r="5" fill="#F5A623" stroke="white" stroke-width="1"/>

<!-- Stoichiometry -->
<text x="795" y="250" text-anchor="middle" font-size="16" fill="#555">~5 : 5 : 50</text>

<!-- ========== KEY LABEL PILL (green for trans-comp) ========== -->
<rect x="100" y="318" width="700" height="36" rx="18" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
<text x="450" y="342" text-anchor="middle" font-size="20" font-weight="bold" fill="#2E7D32">TRANS-COMP &#8212; 100% VP1-VHH (N-term), WT VP2/VP3</text>

<!-- ========== LEGEND (5 items, 16pt) ========== -->
<rect x="170" y="375" width="16" height="16" rx="3" fill="#0A2540"/>
<text x="192" y="389" font-size="16" fill="#555">VP1</text>
