<!-- ========== ARROW ========== -->
<line x1="650" y1="182" x2="682" y2="182" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>

<!-- ========== RESULT STRIP ========== -->
<rect x="700" y="52" width="190" height="250" rx="6" fill="#FAFAFA" stroke="#DDD"/>
<text x="795" y="78" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Resulting Capsid</text>

<!-- Icosahedral capsid (oblique 3D projection, 10 visible faces) -->
<polygon points="829,138 855,179 855,126" fill="#A8C8E8" stroke="#555" stroke-width="0.7"/>
<polygon points="786,95 738,122 764,133" fill="#A8C8E8" stroke="#555" stroke-width="0.7"/>
<polygon points="765,142 737,186 790,188" fill="#A8C8E8" stroke="#555" stroke-width="0.7"/>
<polygon points="820,134 795,90 770,134" fill="#A8C8E8" stroke="#555" stroke-width="0.7"/>
<polygon points="851,122 804,95 826,133" fill="#A8C8E8" stroke="#555" stroke-width="0.7"/>
