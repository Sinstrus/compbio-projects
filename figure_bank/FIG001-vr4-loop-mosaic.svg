<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
<defs><style>
text{font-family:Arial,Helvetica,sans-serif}
</style></defs>
<rect width="800" height="380" fill="white"/>

<!-- Title -->
<text x="400" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Figure 1: VR4 Loop Mosaic (AVD002 + AVD006)</text>
<text x="400" y="40" text-anchor="middle" font-size="11" fill="#888">DNA Ratio 1:1</text>

<!-- ========== BOX 1: AVD002 WT ========== -->
<rect x="10" y="50" width="240" height="200" rx="6" fill="#F8F9FA" stroke="#DDD"/>
<text x="130" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">AVD002 — WT RepCap</text>

<!-- N/C labels -->
<text x="55" y="80" font-size="8" fill="#BBB">N</text>
<text x="237" y="80" text-anchor="end" font-size="8" fill="#BBB">C</text>

<!-- VP1 -->
<text x="22" y="99" font-size="10" font-weight="bold" fill="#333">VP1</text>
<rect x="55" y="84" width="185" height="22" rx="3" fill="#0A2540"/>
<text x="56" y="118" font-size="9" fill="#999">ATG — 80.1 kDa</text>

<!-- VP2 -->
<text x="22" y="143" font-size="10" font-weight="bold" fill="#333">VP2</text>
<rect x="90" y="128" width="150" height="22" rx="3" fill="#3B7DD8"/>
<text x="91" y="162" font-size="9" fill="#999">ACG — 65.5 kDa</text>

<!-- VP3 -->
<text x="22" y="187" font-size="10" font-weight="bold" fill="#333">VP3</text>
<rect x="105" y="172" width="135" height="22" rx="3" fill="#A8C8E8"/>
<text x="106" y="206" font-size="9" fill="#999">ATG — 59.0 kDa</text>

<!-- ========== + SYMBOL ========== -->
<text x="262" y="158" text-anchor="middle" font-size="28" font-weight="bold" fill="#333">+</text>

<!-- ========== BOX 2: AVD006 VR4-VHH ========== -->
<rect x="285" y="50" width="240" height="200" rx="6" fill="#FFF3E0" stroke="#F5A623"/>
<text x="405" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">AVD006 — VR4-VHH (all VPs)</text>

<text x="330" y="80" font-size="8" fill="#BBB">N</text>
<text x="512" y="80" text-anchor="end" font-size="8" fill="#BBB">C</text>

<!-- VP1 + VHH at VR4 -->
<text x="297" y="99" font-size="10" font-weight="bold" fill="#333">VP1</text>
<rect x="330" y="84" width="185" height="22" rx="3" fill="#0A2540"/>
<rect x="433" y="82" width="24" height="26" rx="2" fill="#F5A623"/>
<text x="331" y="118" font-size="9" fill="#999">ATG — ~95.6 kDa</text>

<!-- VP2 + VHH at VR4 -->
<text x="297" y="143" font-size="10" font-weight="bold" fill="#333">VP2</text>
<rect x="365" y="128" width="150" height="22" rx="3" fill="#3B7DD8"/>
<rect x="433" y="126" width="24" height="26" rx="2" fill="#F5A623"/>
<text x="366" y="162" font-size="9" fill="#999">ACG — ~80.7 kDa</text>

<!-- VP3 + VHH at VR4 -->
<text x="297" y="187" font-size="10" font-weight="bold" fill="#333">VP3</text>
<rect x="380" y="172" width="135" height="22" rx="3" fill="#A8C8E8"/>
<rect x="433" y="170" width="24" height="26" rx="2" fill="#F5A623"/>
<text x="381" y="206" font-size="9" fill="#999">ATG — ~74.3 kDa</text>

<!-- VHH callout -->
<line x1="445" y1="200" x2="445" y2="218" stroke="#F5A623" stroke-width="1"/>
<text x="445" y="228" text-anchor="middle" font-size="9" font-weight="bold" fill="#E8941D">VHH (VR4)</text>

<!-- ========== ARROW ========== -->
<text x="540" y="158" text-anchor="middle" font-size="28" font-weight="bold" fill="#333">&gt;</text>
<line x1="530" y1="152" x2="548" y2="152" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs>

<!-- ========== RESULT BOX ========== -->
<rect x="560" y="50" width="230" height="200" rx="6" fill="#FAFAFA" stroke="#DDD"/>
<text x="675" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Resulting Capsid</text>

<rect x="572" y="82" width="8" height="8" rx="1" fill="#0A2540"/>
<text x="585" y="90" font-size="9" fill="#555">VP1: WT + VHH mix</text>
<rect x="572" y="100" width="8" height="8" rx="1" fill="#3B7DD8"/>
<text x="585" y="108" font-size="9" fill="#555">VP2: WT + VHH mix</text>
<rect x="572" y="118" width="8" height="8" rx="1" fill="#A8C8E8"/>
<text x="585" y="126" font-size="9" fill="#555">VP3: WT + VHH mix</text>

<line x1="572" y1="138" x2="778" y2="138" stroke="#EEE"/>
<text x="675" y="154" text-anchor="middle" font-size="9" fill="#555">Stoichiometry: ~5:5:50</text>
<text x="675" y="168" text-anchor="middle" font-size="9" fill="#555">(each species mixed WT/VHH)</text>

<line x1="572" y1="180" x2="778" y2="180" stroke="#EEE"/>
<text x="675" y="196" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">Western Blot</text>
<text x="675" y="212" text-anchor="middle" font-size="9" fill="#888">VP1: doublet (80.1 + 95.6 kDa)</text>
<text x="675" y="226" text-anchor="middle" font-size="9" fill="#888">VP2: doublet (65.5 + 80.7 kDa)</text>
<text x="675" y="240" text-anchor="middle" font-size="9" fill="#888">VP3: doublet (59.0 + 74.3 kDa)</text>

<!-- ========== KEY LABEL ========== -->
<rect x="150" y="262" width="500" height="28" rx="14" fill="#FFF3E0" stroke="#F5A623" stroke-width="1.5"/>
<text x="400" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4850A">MOSAIC — partial VHH on ALL VP species</text>

<!-- ========== LEGEND ========== -->
<rect x="148" y="305" width="12" height="12" rx="2" fill="#0A2540"/>
<text x="165" y="315" font-size="9" fill="#555">VP1</text>
<rect x="208" y="305" width="12" height="12" rx="2" fill="#3B7DD8"/>
<text x="225" y="315" font-size="9" fill="#555">VP2</text>
<rect x="268" y="305" width="12" height="12" rx="2" fill="#A8C8E8"/>
<text x="285" y="315" font-size="9" fill="#555">VP3</text>
<rect x="328" y="305" width="12" height="12" rx="2" fill="#F5A623"/>
<text x="345" y="315" font-size="9" fill="#555">VHH</text>
<rect x="398" y="305" width="12" height="12" rx="2" fill="none" stroke="#CCC" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="415" y="315" font-size="9" fill="#555">Knocked out</text>
<rect x="498" y="305" width="12" height="12" rx="2" fill="none" stroke="#CCC" stroke-width="1" stroke-dasharray="1,3"/>
<text x="515" y="315" font-size="9" fill="#555">Disrupted</text>
</svg>
