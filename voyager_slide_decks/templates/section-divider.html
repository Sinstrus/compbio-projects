<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voyager — Section Divider Slide</title>
  <link rel="stylesheet" href="../css/vygr-base.css">
  <link rel="stylesheet" href="../css/vygr-section.css">
</head>
<body style="margin:0; padding:40px; background:#e0e0e0;">

<!-- === Variant 1: Lab photo "pouring" === -->
<div class="slide slide--section" style="margin-bottom: 60px;">

  <!-- Faded lab-photo background -->
  <div class="section-bg section-bg--photo1"></div>

  <!-- Title (upper-left) -->
  <div class="section-title">
    <h1>Section Title</h1>
    <p>Optional descriptor or context line for this section</p>
  </div>

  <!-- Navy footer bar (~30% of slide) -->
  <div class="section-footer">
    <div class="footer-banner"></div>
    <div class="footer-content">
      <span class="footer-left">4&ensp;|&ensp;CONFIDENTIAL</span>
      <img class="footer-logo" src="../assets/Section_Slide_Footer_Voyager_Logo1.png" alt="Voyager">
    </div>
  </div>

</div>

<!-- === Variant 2: Lab photo "pipette" === -->
<div class="slide slide--section">

  <div class="section-bg section-bg--photo2"></div>

  <div class="section-title">
    <h1>Alternate Photo<br>Background</h1>
    <p>Use <code>section-bg--photo2</code> for the pipette variant</p>
  </div>

  <div class="section-footer">
    <div class="footer-banner"></div>
    <div class="footer-content">
      <span class="footer-left">5&ensp;|&ensp;CONFIDENTIAL</span>
      <img class="footer-logo" src="../assets/Section_Slide_Footer_Voyager_Logo1.png" alt="Voyager">
    </div>
  </div>

</div>

</body>
</html>
