<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voyager — Title / Cover Slide</title>
  <link rel="stylesheet" href="../css/vygr-base.css">
  <link rel="stylesheet" href="../css/vygr-title.css">
</head>
<body style="margin:0; padding:40px; background:#e0e0e0;">

<div class="slide slide--title">

  <!-- Neuron artwork background -->
  <div class="title-bg"></div>

  <!-- Content layer -->
  <div class="title-body">

    <!-- Logo (top-left) -->
    <div class="title-logo">
      <img src="../assets/Title_Slide_Voyager_Logo1.png" alt="Voyager Therapeutics">
    </div>

    <!-- Title + subtitle (vertically centered, left half) -->
    <div class="title-text">
      <h1>Presentation Title<br>Goes Here</h1>
      <div class="title-subtitle">Subtitle or Meeting Context</div>
      <div class="title-date">February 2026</div>
    </div>

    <!-- Footer bar -->
    <div class="title-footer">
      <div class="footer-banner"></div>
      <div class="footer-neuron"></div>
      <div class="footer-content">
        <span>CONFIDENTIAL</span>
      </div>
    </div>

  </div>

</div>

</body>
</html>
